<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>{% block title %}MARKET OFF{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
    <header class="topbar">
        <span class="logo">MARKET <span class="accent">OFF</span></span>
        <a href="{{ url_for('admin_web.manage_products') }}" class="admin-link">Admin</a>

    <main>
        {% block content %}{% endblock %}

    <script src="{{ url_for('static', filename='js/site.js') }}"></script>

</html>
